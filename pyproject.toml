[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transitiq"
version = "0.1.0"
description = "Natural Language Urban Mobility Intelligence Platform"
readme = "docs/PRD.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "httpx>=0.27.0",
    "holidays>=0.50",
    "pyyaml>=6.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "data*",
    "text_to_sql*",
    "ml*",
    "evaluation*",
    "backend*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

